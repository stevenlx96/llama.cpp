apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// 应用统一依赖版本管理
def sharedDepsFile = new File(rootProject.projectDir, 'shared-dependencies/dependencies.gradle')
if (!sharedDepsFile.exists()) {
    sharedDepsFile = new File(rootProject.projectDir.parentFile, 'shared-dependencies/dependencies.gradle')
}
if (!sharedDepsFile.exists()) {
    sharedDepsFile = new File(rootProject.projectDir.parentFile.parentFile, 'shared-dependencies/dependencies.gradle')
}
apply from: sharedDepsFile

android {
    compileSdkVersion 34

    defaultConfig {
        missingDimensionStrategy "target", "demo"
        applicationId "com.stdemo.ggufchat.app"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }

    // Both `app` and `llama-android` ship the same set of native .so files under
    // arm64-v8a/ (see their respective src/main/jniLibs). llama-android is the
    // canonical source because its jniLibs must be embedded into the AAR. When
    // `app` also depends on project(':llama-android'), AGP will try to merge
    // both copies and fail with "More than one file was found with OS
    // independent path 'lib/arm64-v8a/libllama.so'". Deduplicate here.
    packagingOptions {
        jniLibs {
            pickFirsts += [
                'lib/arm64-v8a/libggml-base.so',
                'lib/arm64-v8a/libggml-cpu.so',
                'lib/arm64-v8a/libggml.so',
                'lib/arm64-v8a/libllama.so',
                'lib/arm64-v8a/libllama-android.so',
                'lib/arm64-v8a/libomp.so',
                'lib/arm64-v8a/libonnxruntime.so',
            ]
        }
    }
}

dependencies {
    // 公共依赖
    addCommonDependencies(delegate)

    // UI 依赖
    addUIDependencies(delegate)

    // 项目模块
    implementation project(':llama-android')

    // 测试依赖
    addTestDependencies(delegate)

    // 注意：此项目使用 Kotlin 1.5.32，RecyclerView 1.3.x 是用 Kotlin 1.7.1 编译的，
    // metadata 不兼容会导致 app 模块整体编译失败（并级联出 databinding/R 资源 未解析等假错）。
    // 必须使用 1.2.1（与 demo 模块保持一致）。
    implementation "androidx.recyclerview:recyclerview:1.2.1"
}
