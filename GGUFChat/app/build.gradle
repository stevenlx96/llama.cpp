apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// 应用统一依赖版本管理
def sharedDepsFile = new File(rootProject.projectDir, 'shared-dependencies/dependencies.gradle')
if (!sharedDepsFile.exists()) {
    sharedDepsFile = new File(rootProject.projectDir.parentFile, 'shared-dependencies/dependencies.gradle')
}
if (!sharedDepsFile.exists()) {
    sharedDepsFile = new File(rootProject.projectDir.parentFile.parentFile, 'shared-dependencies/dependencies.gradle')
}
apply from: sharedDepsFile

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.stdemo.ggufchat.app"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

dependencies {
    // 公共依赖
    addCommonDependencies(delegate)

    // UI 依赖
    addUIDependencies(delegate)

    // NOTE: app is fully self-contained — it does NOT depend on :llama-android.
    // app ships its own copy of the engine sources (LlamaEngine, ModelManager,
    // IntentRecognizer, …) and its own jniLibs/arm64-v8a/*.so files. The
    // llama-android module is a separate downstream copy of these same sources
    // packaged into an AAR for Java/UE consumers; demo tests that AAR. There
    // is no compile-time relationship between app and llama-android.

    // 测试依赖
    addTestDependencies(delegate)

    // 注意：此项目使用 Kotlin 1.5.32，RecyclerView 1.3.x 是用 Kotlin 1.7.1 编译的，
    // metadata 不兼容会导致 app 模块整体编译失败（并级联出 databinding/R 资源 未解析等假错）。
    // 必须使用 1.2.1（与 demo 模块保持一致）。
    implementation "androidx.recyclerview:recyclerview:1.2.1"
}
