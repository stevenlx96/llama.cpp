apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.stdemo.ggufchat.demo"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            // Keep JNI symbols in debug build
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes = [
                'META-INF/proguard/androidx-*.pro',
                'META-INF/proguard/retrofit2-*.pro',
                'META-INF/proguard/coroutines.pro',
                'META-INF/MANIFEST.MF'
            ]
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // Local AAR dependency — consume through the flatDir repository declared
    // above using the (name, ext) form. The earlier `files('libs/*.aar')` form
    // triggers AGP 4.2's "Null extracted folder for artifact" bug during
    // IDE sync / model build, because AGP's ArtifactHandler cannot unpack a
    // raw-file AAR that wasn't resolved through a declared repository.
    //
    // Drop the AAR built by `:llama-android:assembleDemoRelease` (which
    // produces `llama-android-demo-release.aar`) into `libs/` and rename it
    // to `llama-android-release.aar`, or adjust `name:` below to match.
    implementation(name: 'llama-android-release', ext: 'aar')

    // AndroidX Core Libraries (使用兼容 Kotlin 1.5.32 的版本)
    implementation "androidx.core:core-ktx:1.7.0"
    implementation "androidx.appcompat:appcompat:1.4.1"

    // Material Design
    implementation "com.google.android.material:material:1.5.0"

    // Layout
    implementation "androidx.constraintlayout:constraintlayout:2.1.3"

    // Activity and Fragment extensions
    implementation "androidx.activity:activity-ktx:1.4.0"
    implementation "androidx.fragment:fragment-ktx:1.4.1"

    // RecyclerView
    implementation "androidx.recyclerview:recyclerview:1.2.1"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.2"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.4.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.4.0"

    // Test dependencies
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.3"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.4.0"
}
